name: CI/CD Pipeline Tablero Ciencia de Datos

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: Run Python Checks (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl==3.1.5 xlrd==2.0.2

      - name: Syntax & Import Check
        run: |
          python -m py_compile pipeline/dao_pipeline.py pipeline/cargar_mes.py servidor/cargador.py servidor/sesiones.py tablero/build_tablero.py
          echo "All Python modules compiled successfully."

  deploy:
    name: Deploy to Contabo VM (CD)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "Conectado al servidor. Iniciando actualización de Tablero Ciencia de Datos..."

            cd /opt/dao

            # Resguardar usuarios (htpasswd) de producción antes de actualizar
            if [ -f "servidor/htpasswd" ]; then
              cp -a servidor/htpasswd servidor/htpasswd.bak
            fi

            # Inicializar o actualizar repositorio Git sin tocar la carpeta datos/
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/daosrl-apps/app-ciencia-datos.git
            else
              git remote set-url origin https://github.com/daosrl-apps/app-ciencia-datos.git
            fi

            git fetch --all
            git reset --hard origin/master

            # Restaurar usuarios (htpasswd) de producción
            if [ -f "servidor/htpasswd.bak" ]; then
              mv servidor/htpasswd.bak servidor/htpasswd
              chmod 644 servidor/htpasswd
            fi

            # Asegurar permisos para los contenedores (usuario 1000 en cargador)
            chmod -R a+rX pipeline servidor tablero
            if [ -d "datos" ]; then
              chown -R 1000:1000 datos
            fi

            # Reconstruir y levantar contenedores del tablero
            cd /opt/dao/servidor
            docker compose up -d --build --force-recreate

            echo "¡Tablero Ciencia de Datos desplegado con éxito en https://cienciadedatos.daosrl.com.ar!"
