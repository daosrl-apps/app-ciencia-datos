# Tablero DAO SRL en Contabo (https://cienciadedatos.daosrl.com.ar) — Nginx (tablero) + servicio de carga (inicio de sesión y carga de los Excel)
# El HTTPS y el dominio los atiende el Nginx de app-dao-ops (de Luciano), que reenvía a 172.20.0.1:8088 (ver DESPLIEGUE.md).
# Instalación: ver servidor/DESPLIEGUE.md. Se levanta desde la carpeta servidor/ con:  docker compose up -d --build
#
# Carpetas de datos (fuera del repositorio, se crean en la instalación):
#   ../datos/excel           Excel de Luciano (llegan por "Subir Excel del mes")
#   ../datos/base            base histórica por mes  ← INCLUIR EN EL BACKUP
#   ../datos/tablero/data    CSV y calidad.json que lee el tablero

name: dao-tablero          # nombre del conjunto en el servidor (contenedores dao-tablero-web-1 y dao-tablero-cargador-1)

services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PUERTO_TABLERO:-172.20.0.1:8088}:80"   # solo dentro del servidor: lo alcanza el Nginx de app-dao-ops, no internet
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../tablero:/srv/tablero:ro
      - ../datos/tablero/data:/srv/data:ro
    depends_on:
      - cargador

  cargador:
    build:
      context: ..
      dockerfile: servidor/Dockerfile.cargador
    restart: unless-stopped
    user: "1000:1000"
    environment:
      DAO_ENTRADA: /datos/excel
      DAO_BASE: /datos/base
      DAO_SALIDA: /datos/tablero/data
      N8N_COPIA_URL: ""          # vacío: no copia al Drive (ver el bloque de n8n al final)
      DAO_HTPASSWD: /config/htpasswd   # usuarios y contraseñas del tablero (se lee en cada inicio de sesión)
      TZ: America/Argentina/Cordoba
    volumes:
      - ../datos:/datos
      - .:/config:ro                   # la carpeta entera (no solo el archivo): así ve los cambios aunque se edite con sed o nano
    # sin "ports": solo lo alcanza Nginx (/subir) por la red interna

