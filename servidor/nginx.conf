# Nginx del tablero DAO SRL. Se publica en https://cienciadedatos.daosrl.com.ar a través del Nginx de app-dao-ops
# (el de Luciano, que atiende los puertos 80 y 443 de todos sus sitios y tiene el certificado). Ver DESPLIEGUE.md.
# Este Nginx solo atiende por dentro del servidor (puerto 8088 en 172.20.0.1).
#
# Inicio de sesión (desde el 12/11/2026): ya no usa la ventanita del navegador (auth_basic). El tablero muestra su
# propia pantalla, el servicio de carga valida usuario y contraseña contra servidor/htpasswd y entrega una clave de
# sesión que el tablero manda en cada pedido. Sin sesión válida no se entregan los datos ni se puede subir nada.
# La página del tablero en sí no tiene datos (es la plantilla): se puede ver sin sesión, pero solo muestra la
# pantalla de inicio.

# Freno extra contra quien prueba contraseñas: 10 intentos por minuto por conexión (el servicio además bloquea 15 min)
limit_req_zone $binary_remote_addr zone=dao_login:1m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    absolute_redirect off;             # redirecciones relativas: el HTTPS lo pone el Nginx de adelante

    # La IP real del usuario la manda el Nginx de Luciano en X-Real-IP (para el bloqueo por intentos fallidos)
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    client_max_body_size 25m;          # los 4 Excel del mes (el servicio de carga limita a 20 MB)

    location = / {
        return 302 /tablero_dao.html;
    }

    # Se publica la PLANTILLA de la versión 2 (sin datos adentro): siempre lee los datos actuales de /data/
    location = /tablero_dao.html {
        alias /srv/tablero/plantilla_v2.html;
        default_type text/html;
        expires -1;                     # siempre la última versión
    }

    # Los datos, solo con sesión iniciada
    location /data/ {
        auth_request /_sesion;
        alias /srv/data/;
        add_header Cache-Control "no-store" always;
    }

    location = /_sesion {
        internal;
        proxy_pass http://cargador:8000/verificar;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Pantalla de inicio de sesión, cerrar sesión y control de la sesión → servicio de carga
    location = /login {
        limit_except POST { deny all; }
        limit_req zone=dao_login burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://cargador:8000/login;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /logout {
        limit_except POST { deny all; }
        proxy_pass http://cargador:8000/logout;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /sesion {
        limit_except GET { deny all; }
        proxy_pass http://cargador:8000/sesion;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Botón "Subir Excel del mes" → servicio de carga (controla la sesión y corre el pipeline en el momento)
    location = /subir {
        limit_except POST { deny all; }
        proxy_pass http://cargador:8000/subir;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Nada más se publica (ni las plantillas, ni scripts, ni /procesar, que solo se usa por la red interna)
    location / {
        return 404;
    }
}
